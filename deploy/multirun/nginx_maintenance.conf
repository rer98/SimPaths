# Include inside each application server, independently of its Python process.
# Preserve upstream application error bodies, including busy/signup forms.
# @author ross richardson
proxy_intercept_errors off;
error_page 502 503 504 =503 /__simpaths_service_unavailable;
location = /__simpaths_service_unavailable {
    internal;
    alias /opt/simpaths-online/JAS-mine-web/static/service_unavailable.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
}
